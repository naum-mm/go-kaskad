name: Web stack
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MANAGEMENT_PORT: "18443"
      SMOKE_PASSWORD: development-password
    steps:
      - uses: actions/checkout@v4
      - name: Unit and syntax checks
        run: |
          python3 -m unittest discover -s tests -v
          bash -n install.sh gokaskad.sh
          bash -n uninstall.sh
          python3 -m py_compile tools/proxy_setup.py
          sh -n gokaskad-openbsd.sh
          node --check web/gui/app.js
          python3 tools/build_preview.py
          git diff --exit-code -- docs/preview.html
      - name: Uninstaller tests in disposable filesystem
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:exec --tmpfs /opt --tmpfs /etc/sysctl.d \
            -e GOKASKAD_UNINSTALL_TEST_CONTAINER=1 -v "$PWD:/src:ro" \
            python:3.13-slim-bookworm python3 /src/tests/uninstall_smoke.py
      - name: Installer recovery and integration cleanup in disposable filesystem
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:exec --tmpfs /opt --tmpfs /etc/sysctl.d --tmpfs /etc/letsencrypt \
            -e GOKASKAD_INSTALL_TEST_CONTAINER=1 -v "$PWD:/src:ro" \
            python:3.13-slim-bookworm python3 /src/tests/install_smoke.py
      - name: Prepare test-only credentials and certificate
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2-utils
          mkdir -p .local/config/tls
          printf '%s\n' "$SMOKE_PASSWORD" | htpasswd -niBC 10 admin > .local/config/admin.htpasswd
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost,IP:127.0.0.1 \
            -keyout .local/config/tls/server.key -out .local/config/tls/server.crt
          echo "CONFIG_DIR=$PWD/.local/config" >> "$GITHUB_ENV"
          echo "SMOKE_CA=$PWD/.local/config/tls/server.crt" >> "$GITHUB_ENV"
      - name: Build and start isolated stack
        run: docker compose -p gokaskad-test -f compose.yaml -f tests/compose.smoke.yaml up -d --build --wait --wait-timeout 180
      - name: Existing nginx SNI, verified TLS, certificate rotation and cleanup
        run: python3 tests/proxy_smoke.py
      - name: Real TCP/UDP, authentication, persistence and isolation
        run: python3 -u tests/docker_smoke.py
      - name: Logs
        if: failure()
        run: docker compose -p gokaskad-test -f compose.yaml -f tests/compose.smoke.yaml logs --tail=150
      - name: Cleanup test stack
        if: always()
        run: docker compose -p gokaskad-test -f compose.yaml -f tests/compose.smoke.yaml down -v
