user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    access_log /dev/stdout;
    error_log /dev/stderr;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s;
    server {
        listen 443 ssl;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        auth_basic "Gokaskad administration";
        auth_basic_user_file /etc/nginx/admin.htpasswd;
        client_max_body_size 16k;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'" always;
        location /api/ {
            limit_req zone=admin burst=20 nodelay;
            set $api_upstream api:8080;
            proxy_pass http://$api_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 130s;
        }
        location / {
            limit_req zone=admin burst=20 nodelay;
            set $gui_upstream gui:8080;
            proxy_pass http://$gui_upstream;
            proxy_set_header Authorization "";
        }
    }
}
