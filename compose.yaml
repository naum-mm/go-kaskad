name: gokaskad
services:
  nginx:
    image: nginx:1.28-alpine
    entrypoint: [nginx, -g, "daemon off;"]
    ports:
      - "${MANAGEMENT_BIND:+${MANAGEMENT_BIND:-}:}${MANAGEMENT_PORT:?Set MANAGEMENT_PORT}:443"
    volumes:
      - ./web/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CONFIG_DIR:?Set CONFIG_DIR}/admin.htpasswd:/etc/nginx/admin.htpasswd:ro
      - ${CONFIG_DIR}/tls:/etc/nginx/tls:ro
    networks: [edge, control]
    depends_on:
      api: {condition: service_healthy}
      gui: {condition: service_started}
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  gui:
    build:
      context: .
      dockerfile: web/gui/Dockerfile
    networks: [control]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: web/api/Dockerfile
    networks: [control]
    volumes:
      - worker-socket:/run/gokaskad:ro
    depends_on:
      worker: {condition: service_healthy}
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: web/worker/Dockerfile
    # Host networking is required to manage the host's firewall. The worker
    # listens ONLY on the shared Unix socket and publishes no TCP/UDP ports.
    network_mode: host
    environment:
      MANAGEMENT_PORT: ${MANAGEMENT_PORT}
      RESERVED_TCP_PORTS: ${RESERVED_TCP_PORTS:-}
      XTABLES_LOCKFILE: /run/lock/xtables.lock
      IPTABLES_BACKEND: ${IPTABLES_BACKEND:-nft}
    volumes:
      - worker-socket:/run/gokaskad
      - worker-data:/var/lib/gokaskad
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, CHOWN]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /run/lock]
    healthcheck:
      test: [CMD, python3, -c, "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(3); s.connect('/run/gokaskad/worker.sock'); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
networks:
  edge: {}
  control:
    internal: true
volumes:
  worker-socket: {}
  worker-data: {}
